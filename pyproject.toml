[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wlc-pulmopath-ai"
version = "0.1.0"
description = "Educational three-class lung histology CNN research prototype"
requires-python = ">=3.10,<3.13"
dependencies = [
  "tensorflow>=2.16,<3",
  "streamlit>=1.36",
  "numpy>=1.24,<2",
  "pandas>=2.0",
  "Pillow>=10.0",
  "scikit-learn>=1.3",
  "matplotlib>=3.8",
]

[tool.setuptools.packages.find]
include = ["pulmopath*"]
